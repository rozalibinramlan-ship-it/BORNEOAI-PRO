<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borneo Pro Trade V3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body { background:#0f172a; color:#e2e8f0; font-family: Inter, sans-serif; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; transition: all 0.3s ease; }
.badge { padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; }
.signal-box { padding: 20px; border-radius: 12px; text-align: center; }
.pulse-green { animation: pulseGreen 2s infinite; }
.pulse-red { animation: pulseRed 2s infinite; }
@keyframes pulseGreen { 0%, 100% { box-shadow: 0 0 20px rgba(34,197,94,0.4); } 50% { box-shadow: 0 0 40px rgba(34,197,94,0.8); } }
@keyframes pulseRed { 0%, 100% { box-shadow: 0 0 20px rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 40px rgba(239,68,68,0.8); } }
</style>
</head>
<body class="p-4">
<h1 class="text-xl font-bold mb-4">🚀 Borneo Pro Trade V3 <span id="status" class="text-xs text-slate-400">LOCK 1 JAM</span></h1>

<!-- ===== 4 TIMEFRAME CONFIRMATION ===== -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
  <div class="card text-center" id="card-m5">
    <div class="text-xs text-slate-400">M5</div>
    <div id="m5" class="font-bold text-lg">-</div>
  </div>
  <div class="card text-center" id="card-m15">
    <div class="text-xs text-slate-400">M15</div>
    <div id="m15" class="font-bold text-lg">-</div>
  </div>
  <div class="card text-center" id="card-h1">
    <div class="text-xs text-slate-400">H1</div>
    <div id="h1" class="font-bold text-lg">-</div>
  </div>
  <div class="card text-center" id="card-h4">
    <div class="text-xs text-slate-400">H4</div>
    <div id="h4" class="font-bold text-lg">-</div>
  </div>
</div>

<!-- ===== SIGNAL + SL/TP + REASON ===== -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
  <div class="card">
    <div class="text-xs text-slate-400">SIGNAL</div>
    <div id="signal" class="text-2xl font-bold mt-1">WAIT</div>
    <div id="harga" class="text-sm mt-1 text-slate-300">-</div>
    <div id="mtf-grade" class="text-xs mt-2 text-cyan-400"></div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400">ENTRY / SL / TP</div>
    <div id="entry" class="text-sm mt-1 text-slate-300">-</div>
    <div id="sltp" class="text-xs mt-2 text-slate-300"></div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400">FILTER / REASON</div>
    <div id="reasons" class="text-xs mt-1 text-yellow-300"></div>
    <div id="cooldown" class="text-xs text-yellow-400 mt-2"></div>
    <div id="lock" class="text-xs text-green-400 mt-1"></div>
  </div>
</div>

<!-- ===== INDICATORS + PATTERN ===== -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
  <div class="card">
    <div class="text-xs text-slate-400">INDICATOR</div>
    <div id="indicators" class="text-xs mt-2 text-slate-300"></div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400">CANDLE PATTERN</div>
    <div id="pattern" class="text-sm mt-2 text-slate-300"></div>
  </div>
</div>

<!-- ===== CHART ===== -->
<div class="card mb-4">
  <div class="text-xs text-slate-400 mb-2">CHART XAU/USD — M5</div>
  <div id="chart" style="height:400px"></div>
</div>

<!-- ===== TRADE JOURNAL ===== -->
<div class="card">
  <div class="text-xs text-slate-400 mb-2">TRADE JOURNAL</div>
  <div id="journal" class="text-xs text-slate-300">Loading...</div>
</div>

<script>
let chart, candleSeries;

function initChart() {
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    layout: { background: { color: '#1e293b' }, textColor: '#94a3b8' },
    grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
    width: el.clientWidth,
    height: 400
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444'
  });
  window.addEventListener('resize', () => {
    chart.applyOptions({ width: el.clientWidth });
  });
}
initChart();

// ===== UPDATE 4TF CONFIRMATION =====
function updateMTF(mtf) {
  if (!mtf || !mtf.timeframes || mtf.timeframes.length === 0) {
    ['m5','m15','h1','h4'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = 'WAIT<br><small>-</small>';
    });
    return;
  }
  
  mtf.timeframes.forEach(t => {
    const id = t.label.toLowerCase();
    const el = document.getElementById(id);
    const card = document.getElementById('card-' + id);
    if (!el) return;
    
    const color = t.signal === 'BUY' ? '#22c55e' : t.signal === 'SELL' ? '#ef4444' : '#94a3b8';
    const icon = t.signal === 'BUY' ? '🟢' : t.signal === 'SELL' ? '🔴' : '⚪';
    
    el.innerHTML = `<span style="color:${color}">${icon} ${t.signal}</span><br><small class="text-slate-400">RSI ${t.rsi}</small>`;
    
    if (card) card.style.borderColor = color;
  });
  
  const g = document.getElementById('mtf-grade');
  if (g) {
    const gradeIcon = mtf.grade === 'A+' ? '🚀' : mtf.grade === 'B' ? '⭐' : '⏳';
    g.innerText = `${gradeIcon} ${mtf.grade} | ${mtf.agreement} | ${mtf.consensus} | ${mtf.confidence}`;
  }
}

// ===== LOAD SIGNAL =====
async function loadSignal() {
  try {
    const res = await fetch('/api/signal?symbol=XAU/USD&tf=5min');
    const data = await res.json();
    
    // Signal box
    const sigEl = document.getElementById('signal');
    sigEl.innerText = data.signal;
    sigEl.style.color = data.warna || '#94a3b8';
    
    // Pulse animation
    if (data.signal === 'BUY') {
      sigEl.className = 'text-2xl font-bold mt-1 text-green-400';
    } else if (data.signal === 'SELL') {
      sigEl.className = 'text-2xl font-bold mt-1 text-red-400';
    } else {
      sigEl.className = 'text-2xl font-bold mt-1 text-slate-400';
    }
    
    // Harga
    document.getElementById('harga').innerText = 
      `Harga: ${data.harga} | Entry: ${data.harga_entry} | ${data.session} | ${data.masa}`;
    
    // Entry
    document.getElementById('entry').innerText = 
      `Bid: ${data.bid} | Ask: ${data.ask} | Spread: ${data.spread}`;
    
    // SL/TP
    if (data.sltp) {
      document.getElementById('sltp').innerHTML = 
        `🛑 SL: ${data.sltp.sl} (${data.sltp.slPips} pips)<br>` +
        `✅ TP1: ${data.sltp.tp1} | TP2: ${data.sltp.tp2} | TP3: ${data.sltp.tp3}<br>` +
        `💰 Lot: ${data.risk_mgmt?.lotSize} | Risk: $${data.risk_mgmt?.riskAmount}`;
    }
    
    // Reasons
    const reasonsHtml = (data.reasons || []).map(r => `• ${r}`).join('<br>');
    document.getElementById('reasons').innerHTML = reasonsHtml || 'Tiada filter';
    
    // Indicators
    document.getElementById('indicators').innerHTML = 
      `EMA9: ${data.ema9} | EMA21: ${data.ema21} | EMA50: ${data.ema50}<br>` +
      `RSI: ${data.rsi} | ATR%: ${data.atrPercent}<br>` +
      `SNR Support: ${data.snr?.support} | Resistance: ${data.snr?.resistance}<br>` +
      `POC: ${data.snr?.poc}`;
    
    // Pattern
    const pat = data.candle_pattern;
    if (pat && pat.pattern !== 'NONE') {
      document.getElementById('pattern').innerHTML = 
        `${pat.icon || '📊'} <span class="font-bold">${pat.pattern}</span><br>` +
        `Bias: ${pat.bias} | Strength: ${pat.strength}%`;
    } else {
      document.getElementById('pattern').innerHTML = '⚪ Tiada pattern';
    }
    
    // Cooldown
    const cooldownEl = document.getElementById('cooldown');
    if (data.cooldown && data.cooldown.active) {
      cooldownEl.innerText = `⏳ Cooldown: ${data.cooldown.remainMin} minit lagi`;
    } else {
      cooldownEl.innerText = '';
    }
    
    // Lock
    const lockEl = document.getElementById('lock');
    if (data.locked) {
      const lockText = data.lockAgeText || `${data.lockAgeMin}m`;
      lockEl.innerText = `🔒 LOCKED ${lockText}/1j | Entry: ${data.harga_entry}`;
      lockEl.style.color = '#22c55e';
    } else {
      lockEl.innerText = '';
    }
    
    // Reset pattern
    if (data.reset_pattern) {
      lockEl.innerText += ` | Reset: ${data.reset_pattern}`;
    }
    
    // Update 4TF
    updateMTF(data.mtf);
    
    // Load candles
    loadCandles();
    
    // Load journal (kalau ada)
    loadJournal();
    
  } catch (e) {
    console.log('loadSignal error', e.message);
  }
}

async function loadCandles() {
  try {
    const res = await fetch('/api/candles?symbol=XAU/USD&tf=5min');
    const d = await res.json();
    if (d.candles) candleSeries.setData(d.candles);
  } catch (e) {}
}

async function loadJournal() {
  try {
    const res = await fetch('/api/trade-journal');
    const d = await res.json();
    if (d.journal && d.journal.length > 0) {
      const html = d.journal.slice(0, 5).map(j => 
        `<div style="padding:4px 0;border-bottom:1px solid #334155">` +
        `${j.time} | <span style="color:${j.signal === 'BUY' ? '#22c55e' : '#ef4444'}">${j.signal}</span> @ ${j.entry} | SL: ${j.sl} | Lot: ${j.lot}` +
        `</div>`
      ).join('');
      document.getElementById('journal').innerHTML = html;
    } else {
      document.getElementById('journal').innerHTML = 'Belum ada trade';
    }
  } catch (e) {}
}

// ===== START =====
loadSignal();
setInterval(loadSignal, 60000);  // Refresh 1 minit

</script>
</body>
</html>
